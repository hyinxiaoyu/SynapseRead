name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads the version from `packageManager`; must precede setup-node's cache.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build:web

  e2e:
    # Real engines in real Chromium, under the app's CSP. Both images ship Chrome;
    # macOS catches platform differences in headless window activation and rendering.
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The macOS image's own Chrome lives in /Applications, where GoogleUpdater runs
      # through the job and can replace it in place mid-suite (run 43121437302 went from
      # 156 to 157 between two flows, and the flows open across the swap timed out).
      # Chrome for Testing goes to the tool cache, which nothing updates. Ubuntu runs the
      # distribution's Chromium, which nothing updates during a job either.
      - name: Pin Chrome for Testing
        if: runner.os == 'macOS'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 157.0.8103.78

      - name: End-to-end
        # Headless Ubuntu has no desktop session bus; a transient session bus keeps
        # Chromium's dbus/bus.cc error spam out of launch diagnostics (#70).
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && command -v dbus-run-session >/dev/null 2>&1; then
            dbus-run-session -- pnpm e2e
          else
            pnpm e2e
          fi
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload screenshots of failed flows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.os }}
          path: apps/desktop/e2e-failures/
          if-no-files-found: ignore
